<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2100 970" role="img" aria-labelledby="title desc">
  <title id="title">personalRAG: arquitetura de contêineres</title>
  <desc id="desc">Diagrama C4 nível 2 do personalRAG. Agentes acessam o serviço MCP pelo proxy local. O CLI envia documentos Markdown ao Cloud Storage, e um job diário sincroniza o bucket com o Firestore. O serviço MCP consulta Firestore e Vertex AI.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#26343c" stroke-width="1" opacity=".42"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#46d9e8"/></marker>
    <style>
      .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
      .label{font-family:'Chakra Petch',system-ui,sans-serif;font-weight:700;letter-spacing:2px}
      .title{font-family:'Shippori Mincho',Georgia,serif;font-weight:800}
      .node{fill:#121a1f;stroke:#26343c;stroke-width:2}
      .node-warm{fill:#121a1f;stroke:#ffb000;stroke-width:2}
      .node-cool{fill:#121a1f;stroke:#46d9e8;stroke-width:2}
      .flow{fill:none;stroke:#46d9e8;stroke-width:3;marker-end:url(#arrow)}
      .sync{fill:none;stroke:#ffb000;stroke-width:3;marker-end:url(#arrow)}
      .minor{fill:#8a979c;font-size:16px}
      .body{fill:#ece6d8;font-size:18px}
      .heading{fill:#ffb000;font-size:22px}
      .block-title{font-size:22px}
    </style>
  </defs>
  <rect width="2100" height="970" fill="#0a0f12"/>
  <rect width="2100" height="970" fill="url(#grid)"/>
  <path d="M32 32H2068V938H32Z" fill="none" stroke="#26343c" stroke-width="2"/>
  <text x="70" y="95" class="title" fill="#ffb000" font-size="48">personalRAG</text>
  <text x="72" y="132" class="mono minor">C4 · NÍVEL 2 · CONTÊINERES E FLUXOS</text>

